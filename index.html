<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>操作系统 复习刷题系统</title>
<meta name="description" content="操作系统选择题刷题：15 组 428 题">
<meta name="theme-color" content="#0f9d76">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="OS刷题">
<link rel="stylesheet" href="css/style.css">
<style>
  /* 操作系统主题色（青绿），与“组成原理”蓝色版区分 */
  :root { --brand:#0f9d76; --brand-light:#34d3a0; --brand-bg:#e7f7f2; --brand-bg-deep:#c9ece2; }
  [data-theme="dark"] { --brand:#34d3a0; --brand-light:#5ee6bd; --brand-bg:#123028; --brand-bg-deep:#174034; }
  .header { background:linear-gradient(135deg,#0f9d76 0%,#14b88a 45%,#34d3a0 100%) !important; box-shadow:0 8px 28px rgba(15,157,118,.25) !important; }
  .progress-bar-inner { background:linear-gradient(90deg,#0f9d76,#34d3a0) !important; }
  .back-to-top { background:#0f9d76 !important; box-shadow:0 4px 16px rgba(15,157,118,.35) !important; }
  .q-card .q-type.s { background:#e7f7f2; color:#0f9d76; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>操作系统_选择<span class="net-badge" id="net-badge"><span class="net-dot"></span><span class="net-text">在线</span></span></h1>
    <p>单选  · 15 组 428 题</p>
  </div>

  <div class="progress-wrap">
    <div class="progress-bar-outer"><div class="progress-bar-inner" id="progress-bar" style="width:0%;"></div></div>
    <span class="progress-label" id="progress-label">0 / 428</span>
  </div>

  <div class="tabs" id="tabs-container"></div>

  <div class="chapter-bar">
    <button class="icon-btn" id="prev-ch-btn" aria-label="上一章">‹ 上一章</button>
    <button class="ch-title icon-btn menu-only" id="menu-btn" style="flex:0 0 auto;border:none;background:none;padding:0;">☰</button>
    <span class="ch-title" id="ch-title">章节加载中…</span>
    <button class="icon-btn" id="next-ch-btn" aria-label="下一章">下一章 ›</button>
  </div>

  <div class="toolbar-row">
    <div class="search-wrap">
      <span class="search-icon">&#128269;</span>
      <input type="search" id="search-input" placeholder="搜索题干 / 选项 / 解析关键词 ..." enterkeyhint="search">
    </div>
    <select class="filter-select" id="filter-select">
      <option value="all">全部题目</option>
      <option value="done">已作答</option>
      <option value="undone">未作答</option>
      <option value="wrong">只看错题</option>
      <option value="correct">只看正确</option>
    </select>
    <button class="theme-toggle" id="theme-btn" title="切换暗色/亮色模式" aria-label="切换主题">&#127763;</button>
  </div>

  <div class="toolbar">
    <div class="score">正确 <span id="score-num">0</span> / <span id="total-num">0</span> (<span id="score-pct">0%</span>)</div>
    <div class="btn-row">
      <button class="btn" id="show-all-btn">展开所有答案</button>
      <button class="btn" id="reset-btn" style="display:none">重新作答</button>
      <button class="btn" id="export-btn" title="导出答题记录为文件">导出进度</button>
      <button class="btn" id="import-btn" title="从文件恢复答题记录">导入进度</button>
      <input type="file" id="import-file" accept="application/json,.json" hidden>
    </div>
  </div>

  <div id="quiz-container">
    <div class="loading-state"><div class="spinner"></div>正在初始化…</div>
  </div>

  <div class="footer">操作系统刷题  · 答题进度自动保存在本机</div>
</div>

<!-- 移动端章节抽屉 -->
<div class="drawer-mask" id="drawer-mask"></div>
<aside class="drawer" id="drawer" aria-label="章节目录">
  <div class="drawer-header">
    <strong>章节目录</strong>
    <button class="drawer-close" id="drawer-close" aria-label="关闭">✕</button>
  </div>
  <div class="drawer-list" id="drawer-list"></div>
  <div class="drawer-footer">
    <button class="btn" id="drawer-export">导出进度</button>
    <button class="btn" id="drawer-import">导入进度</button>
  </div>
</aside>

<button class="back-to-top" id="back-to-top" title="返回顶部" aria-label="返回顶部">&uarr;</button>
<div class="toast" id="toast"></div>

<script src="js/app.js"></script>
<script>
  document.getElementById('drawer-export').addEventListener('click', () =>
    document.getElementById('export-btn').click());
  document.getElementById('drawer-import').addEventListener('click', () =>
    document.getElementById('import-btn').click());
</script>
</body>
</html>
